name: QueueForge V2 CI

on:
  push:
    branches: [ master, main, feature/multi-instance-workers, feature/v2-control-plane-ui, feature/v2-public-demo-hardening, feature/v2-deployment-preparation ]
  pull_request:
    branches: [ master, main, feature/multi-instance-workers, feature/v2-control-plane-ui, feature/v2-public-demo-hardening, feature/v2-deployment-preparation ]
  workflow_dispatch:
    inputs:
      run_destructive_chaos:
        description: 'Run destructive cross-process fault-injection tests'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Primary Backend Tests (ACID Queue, SKIP LOCKED, FairShare DRR, Security)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: queueforge
          POSTGRES_USER: queueforge_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueforge_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Backend Tests
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: queueforge
          DB_USERNAME: queueforge_app
          DB_PASSWORD: ci_test_password
          ADMIN_API_KEY: ci_admin_secret_key_testing_only
        run: |
          mvn clean test -DargLine="-XX:+UseSerialGC -Xmx384m" -B

  # ----------------------------------------------------------------------------
  # 2. Simulated Payment Receiver Tests (Durable Inbox, Idempotent Processing)
  # ----------------------------------------------------------------------------
  receiver-test:
    name: Simulated Payment Receiver Tests
    runs-on: ubuntu-latest

    services:
      postgres-receiver:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: queueforge_payment_receiver
          POSTGRES_USER: queueforge_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U queueforge_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Receiver Tests
        working-directory: ./simulated-payment-receiver
        env:
          RECEIVER_DB_HOST: 127.0.0.1
          RECEIVER_DB_PORT: 5433
          RECEIVER_DB_NAME: queueforge_payment_receiver
          DB_USERNAME: queueforge_app
          DB_PASSWORD: ci_test_password
        run: |
          mvn clean test -DargLine="-XX:+UseSerialGC -Xmx256m" -B

  # ----------------------------------------------------------------------------
  # 3. Frontend Quality, Type Checking & Build
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Linter Check
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Compilation Check
        working-directory: ./frontend
        run: npx tsc -b

      - name: Vitest Unit & Component Tests
        working-directory: ./frontend
        run: npm run test

      - name: Vite Production Build
        working-directory: ./frontend
        run: npm run build

      - name: NPM Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ----------------------------------------------------------------------------
  # 4. Docker Container Image Verification for All Application Modules
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Container Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, receiver-test, frontend-test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: queueforge-backend:ci

      - name: Build Simulated Payment Receiver Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./simulated-payment-receiver
          file: ./simulated-payment-receiver/Dockerfile
          push: false
          tags: queueforge-payment-receiver:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: queueforge-frontend:ci

  # ----------------------------------------------------------------------------
  # 5. Full-Stack Multi-Worker Docker Compose Smoke Test
  # ----------------------------------------------------------------------------
  full-stack-smoke-test:
    name: Full-Stack Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build-verification]
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate High-Entropy Cluster Credentials
        run: |
          DYNAMIC_ADMIN_KEY=$(openssl rand -hex 24)
          DYNAMIC_RECEIVER_KEY=$(openssl rand -hex 24)
          DYNAMIC_DB_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$DYNAMIC_ADMIN_KEY"
          echo "::add-mask::$DYNAMIC_RECEIVER_KEY"
          echo "::add-mask::$DYNAMIC_DB_PASS"
          echo "ADMIN_API_KEY=$DYNAMIC_ADMIN_KEY" >> $GITHUB_ENV
          echo "RECEIVER_SERVICE_KEY=$DYNAMIC_RECEIVER_KEY" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DYNAMIC_DB_PASS" >> $GITHUB_ENV

      - name: Start QueueForge V2 Multi-Instance Cluster
        env:
          FRONTEND_PORT: 8088
        run: |
          docker compose -f docker-compose.v2.yml up -d --build

      - name: Wait for Services Health
        run: |
          echo "Waiting for all 7 containers to become healthy..."
          timeout 120s bash -c 'until [ $(docker ps --filter "health=healthy" -q | wc -l) -ge 7 ]; do echo "Waiting for healthy containers... ($(docker ps --filter "health=healthy" -q | wc -l)/7)"; sleep 3; done'
          docker compose -f docker-compose.v2.yml ps

      - name: Execute Live Smoke Test Suite
        env:
          FRONTEND_URL: http://127.0.0.1:8088
        run: |
          chmod +x scripts/smoke-test-v2.sh
          bash scripts/smoke-test-v2.sh

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== DUMPING CLUSTER CONTAINER LOGS ==="
          docker compose -f docker-compose.v2.yml logs --tail 200

      - name: Tear Down Cluster
        if: always()
        run: |
          docker compose -f docker-compose.v2.yml down -v

  # ----------------------------------------------------------------------------
  # 6. Playwright Browser E2E Verification
  # ----------------------------------------------------------------------------
  browser-e2e-test:
    name: Browser E2E Verification (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build-verification]
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Generate High-Entropy Cluster Credentials
        run: |
          DYNAMIC_ADMIN_KEY=$(openssl rand -hex 24)
          DYNAMIC_RECEIVER_KEY=$(openssl rand -hex 24)
          DYNAMIC_DB_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$DYNAMIC_ADMIN_KEY"
          echo "::add-mask::$DYNAMIC_RECEIVER_KEY"
          echo "::add-mask::$DYNAMIC_DB_PASS"
          echo "ADMIN_API_KEY=$DYNAMIC_ADMIN_KEY" >> $GITHUB_ENV
          echo "RECEIVER_SERVICE_KEY=$DYNAMIC_RECEIVER_KEY" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DYNAMIC_DB_PASS" >> $GITHUB_ENV

      - name: Start Cluster in Background
        env:
          FRONTEND_PORT: 8088
        run: |
          docker compose -f docker-compose.v2.yml up -d --build
          echo "Waiting for services to become healthy..."
          timeout 120s bash -c 'until [ $(docker ps --filter "health=healthy" -q | wc -l) -ge 7 ]; do sleep 3; done'
          docker compose -f docker-compose.v2.yml ps

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        env:
          BASE_URL: http://127.0.0.1:8088
        run: ADMIN_API_KEY="$ADMIN_API_KEY" npm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear Down Cluster
        if: always()
        run: |
          docker compose -f docker-compose.v2.yml down -v

  # ----------------------------------------------------------------------------
  # 7. Production Deployment Pipeline & VPS Configuration Verification
  # ----------------------------------------------------------------------------
  deploy-config-verify:
    name: Production Deployment Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Presence of Operational VPS Scripts
        run: |
          for script in preflight.sh deploy.sh healthcheck.sh backup.sh restore-test.sh seed-demo-data.sh prepare-host.sh; do
            test -f "deploy/vps/$script" || { echo "Missing script: $script"; exit 1; }
          done
          echo "All 7 operational VPS scripts verified present."

      - name: Validate Shell Scripts Syntax (bash -n)
        run: |
          for script in deploy/vps/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Validate Production Compose Schema with Dummy Secrets
        env:
          DB_PASSWORD: ci_dummy_production_db_password_1234
          ADMIN_API_KEY: ci_dummy_admin_api_key_12345678901234567890123456789012
          RECEIVER_SERVICE_KEY: ci_dummy_receiver_key_12345678901234567890123456789012
          FRONTEND_PORT: 8088
          IMAGE_TAG: latest
        run: |
          echo "Validating base docker-compose.prod.v2.yml..."
          docker compose -f docker-compose.prod.v2.yml config --quiet
          echo "Validating GHCR override docker-compose.prod.ghcr.yml..."
          docker compose -f docker-compose.prod.v2.yml -f docker-compose.prod.ghcr.yml config --quiet

      - name: Assert Topology & Port Isolation via Config Inspection
        env:
          DB_PASSWORD: ci_dummy_production_db_password_1234
          ADMIN_API_KEY: ci_dummy_admin_api_key_12345678901234567890123456789012
          RECEIVER_SERVICE_KEY: ci_dummy_receiver_key_12345678901234567890123456789012
          FRONTEND_PORT: 8088
          IMAGE_TAG: latest
        run: |
          python3 -c "
          import subprocess, json, os
          env = os.environ.copy()
          out = subprocess.check_output(['docker', 'compose', '-f', 'docker-compose.prod.v2.yml', '-f', 'docker-compose.prod.ghcr.yml', 'config', '--format', 'json'], env=env)
          cfg = json.loads(out)
          services = cfg.get('services', {})
          assert len(services) == 7, f'Expected 7 services, got {len(services)}'
          for name, s_cfg in services.items():
              ports = s_cfg.get('ports', [])
              if name != 'frontend':
                  assert len(ports) == 0, f'Service {name} unexpectedly exposes host ports: {ports}'
              else:
                  assert len(ports) == 1 and str(ports[0].get('published')) == '8088', f'Frontend ports unexpected: {ports}'
          print('Verified: Exactly 7 services, zero exposed database/worker ports, frontend on 127.0.0.1:8088.')
          "

      - name: Verify Missing Required Secrets Fail Fast
        run: |
          echo "Verifying fail-fast validation when required secrets are missing..."
          if docker compose -f docker-compose.prod.v2.yml config --quiet 2>/dev/null; then
            echo "ERROR: Compose unexpectedly succeeded without required secrets!"
            exit 1
          else
            echo "SUCCESS: Compose correctly rejected missing production secrets."
          fi

      - name: Audit Template Environment File
        run: |
          test -f .env.production.example
          grep -q "DB_PASSWORD=" .env.production.example
          grep -q "ADMIN_API_KEY=" .env.production.example
          grep -q "RECEIVER_SERVICE_KEY=" .env.production.example
          # Ensure no real secrets are embedded
          ! grep -E "DB_PASSWORD=[a-zA-Z0-9]{16,}" .env.production.example || exit 1
