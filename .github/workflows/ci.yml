name: QueueForge CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: queueforge
          POSTGRES_USER: queueforge_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Tests
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: queueforge
          DB_USERNAME: queueforge_app
          DB_PASSWORD: ci_test_password
          ADMIN_API_KEY: ci_admin_secret_key_testing_only
        run: |
          mvn clean test -B

  frontend-test:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Linter Check
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Compilation Check
        working-directory: ./frontend
        run: npx tsc -b

      - name: Vitest Unit & Component Tests
        working-directory: ./frontend
        run: npm run test

      - name: Vite Production Build
        working-directory: ./frontend
        run: npm run build

      - name: NPM Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  docker-build-verification:
    name: Docker Container Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: queueforge-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: queueforge-frontend:ci
