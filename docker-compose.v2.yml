# ==============================================================================
# QueueForge V2: Complete Multi-Instance & Distributed Outbox Topology
# Optimized for local verification and evaluation on ~8 GB RAM laptops.
# ==============================================================================
name: queueforge-v2

networks:
  qf-v2-backend-net:
    driver: bridge
    internal: false
  qf-v2-receiver-net:
    driver: bridge
    internal: false
  qf-v2-frontend-net:
    driver: bridge

volumes:
  qf-v2-sender-data:
    driver: local
  qf-v2-receiver-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Sender PostgreSQL Database (Durable Queue & Outbox Events)
  # ----------------------------------------------------------------------------
  sender-db:
    image: postgres:16.8-alpine
    container_name: qf-v2-sender-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueforge
      POSTGRES_USER: queueforge_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
    volumes:
      - qf-v2-sender-data:/var/lib/postgresql/data
    networks:
      - qf-v2-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueforge_app -d queueforge"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Independent Receiver PostgreSQL Database (Idempotent Inbox & Charges)
  # ----------------------------------------------------------------------------
  receiver-db:
    image: postgres:16.8-alpine
    container_name: qf-v2-receiver-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueforge_payment_receiver
      POSTGRES_USER: queueforge_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
    volumes:
      - qf-v2-receiver-data:/var/lib/postgresql/data
    networks:
      - qf-v2-receiver-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueforge_app -d queueforge_payment_receiver"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. Simulated Payment Receiver Service (Independent JVM)
  # ----------------------------------------------------------------------------
  payment-receiver:
    build:
      context: ./simulated-payment-receiver
      dockerfile: Dockerfile
    image: queueforge-payment-receiver:v2
    container_name: qf-v2-payment-receiver
    restart: unless-stopped
    environment:
      SERVER_PORT: 8098
      DB_HOST: receiver-db
      DB_PORT: 5432
      DB_NAME: queueforge_payment_receiver
      DB_USERNAME: queueforge_app
      DB_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
      RECEIVER_SERVICE_AUTH_ENABLED: "true"
      RECEIVER_SERVICE_KEY: ${RECEIVER_SERVICE_KEY:-qf_v2_internal_service_key_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx160m -Xms32m -Xss256k -XX:TieredStopAtLevel=1"
    networks:
      - qf-v2-receiver-net
    depends_on:
      receiver-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8098/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. API-Only Node (Handles Client Submissions & Operations Console)
  # ----------------------------------------------------------------------------
  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: queueforge-backend:v2
    container_name: qf-v2-api-server
    restart: unless-stopped
    environment:
      QUEUEFORGE_MODE: API_ONLY
      QUEUEFORGE_INSTANCE_ID: api-node-v2
      SERVER_PORT: 8085
      DB_HOST: sender-db
      DB_PORT: 5432
      DB_NAME: queueforge
      DB_USERNAME: queueforge_app
      DB_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-qf_v2_release_candidate_admin_key_2026}
      WORKER_ENABLED: "false"
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx220m -Xms64m -Xss256k -XX:TieredStopAtLevel=1"
    networks:
      - qf-v2-backend-net
      - qf-v2-frontend-net
    depends_on:
      sender-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------------------------------
  # 5. Worker Instance 1 (Independent Process: Claims Jobs & Dispatches Outbox)
  # ----------------------------------------------------------------------------
  worker-1:
    image: queueforge-backend:v2
    container_name: qf-v2-worker-1
    restart: unless-stopped
    environment:
      QUEUEFORGE_MODE: WORKER_ONLY
      QUEUEFORGE_INSTANCE_ID: worker-v2-node-1
      SERVER_PORT: 8086
      DB_HOST: sender-db
      DB_PORT: 5432
      DB_NAME: queueforge
      DB_USERNAME: queueforge_app
      DB_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-qf_v2_release_candidate_admin_key_2026}
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: 2
      WORKER_POLL_INTERVAL_MS: 200
      WORKER_LEASE_DURATION_SECONDS: 10
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 3
      WORKER_RECOVERY_POLL_INTERVAL_MS: 4000
      QUEUEFORGE_OUTBOX_PAYMENT_URL: "http://payment-receiver:8098/api/v1/payments/charges"
      QUEUEFORGE_OUTBOX_PAYMENT_SERVICE_KEY: ${RECEIVER_SERVICE_KEY:-qf_v2_internal_service_key_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx220m -Xms64m -Xss256k -XX:TieredStopAtLevel=1"
    networks:
      - qf-v2-backend-net
      - qf-v2-receiver-net
    depends_on:
      sender-db:
        condition: service_healthy
      api-server:
        condition: service_healthy
      payment-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health/liveness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------------------------------
  # 6. Worker Instance 2 (Independent Process: Concurrent Claims & Fencing)
  # ----------------------------------------------------------------------------
  worker-2:
    image: queueforge-backend:v2
    container_name: qf-v2-worker-2
    restart: unless-stopped
    environment:
      QUEUEFORGE_MODE: WORKER_ONLY
      QUEUEFORGE_INSTANCE_ID: worker-v2-node-2
      SERVER_PORT: 8087
      DB_HOST: sender-db
      DB_PORT: 5432
      DB_NAME: queueforge
      DB_USERNAME: queueforge_app
      DB_PASSWORD: ${DB_PASSWORD:-qf_v2_db_pass_2026}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-qf_v2_release_candidate_admin_key_2026}
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: 2
      WORKER_POLL_INTERVAL_MS: 200
      WORKER_LEASE_DURATION_SECONDS: 10
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 3
      WORKER_RECOVERY_POLL_INTERVAL_MS: 4000
      QUEUEFORGE_OUTBOX_PAYMENT_URL: "http://payment-receiver:8098/api/v1/payments/charges"
      QUEUEFORGE_OUTBOX_PAYMENT_SERVICE_KEY: ${RECEIVER_SERVICE_KEY:-qf_v2_internal_service_key_2026}
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx220m -Xms64m -Xss256k -XX:TieredStopAtLevel=1"
    networks:
      - qf-v2-backend-net
      - qf-v2-receiver-net
    depends_on:
      sender-db:
        condition: service_healthy
      api-server:
        condition: service_healthy
      payment-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/actuator/health/liveness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------------------------------
  # 7. Frontend Operations Console (Nginx Reverse Proxy to api-server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: queueforge-frontend:v2
    container_name: qf-v2-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    networks:
      - qf-v2-frontend-net
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M
