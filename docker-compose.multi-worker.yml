services:
  multi-db:
    image: postgres:16.8-alpine
    container_name: qf-multi-db
    environment:
      POSTGRES_DB: queueforge_multi
      POSTGRES_USER: qf_test_user
      POSTGRES_PASSWORD: qf_test_pass
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - ./data/multi-worker-db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qf_test_user -d queueforge_multi"]
      interval: 3s
      timeout: 3s
      retries: 10

  multi-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: queueforge-backend:multi
    container_name: qf-multi-api
    environment:
      QUEUEFORGE_MODE: API_ONLY
      QUEUEFORGE_INSTANCE_ID: api-node-1
      DB_HOST: multi-db
      DB_PORT: 5432
      DB_NAME: queueforge_multi
      DB_USERNAME: qf_test_user
      DB_PASSWORD: qf_test_pass
      SERVER_PORT: 8091
      ADMIN_API_KEY: qf_admin_dev_secret_2026
      JAVA_OPTS: "-XX:+UseContainerSupport -Xmx256m -Xms128m"
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      multi-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  multi-worker-1:
    image: queueforge-backend:multi
    container_name: qf-multi-worker-1
    environment:
      QUEUEFORGE_MODE: WORKER_ONLY
      QUEUEFORGE_INSTANCE_ID: worker-instance-1
      DB_HOST: multi-db
      DB_PORT: 5432
      DB_NAME: queueforge_multi
      DB_USERNAME: qf_test_user
      DB_PASSWORD: qf_test_pass
      SERVER_PORT: 8092
      WORKER_CONCURRENCY: 2
      WORKER_POLL_INTERVAL_MS: 150
      WORKER_LEASE_DURATION_SECONDS: 10
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 3
      WORKER_RECOVERY_POLL_INTERVAL_MS: 3000
      ADMIN_API_KEY: qf_admin_dev_secret_2026
      JAVA_OPTS: "-XX:+UseContainerSupport -Xmx256m -Xms128m"
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      multi-db:
        condition: service_healthy
      multi-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M

  multi-worker-2:
    image: queueforge-backend:multi
    container_name: qf-multi-worker-2
    environment:
      QUEUEFORGE_MODE: WORKER_ONLY
      QUEUEFORGE_INSTANCE_ID: worker-instance-2
      DB_HOST: multi-db
      DB_PORT: 5432
      DB_NAME: queueforge_multi
      DB_USERNAME: qf_test_user
      DB_PASSWORD: qf_test_pass
      SERVER_PORT: 8093
      WORKER_CONCURRENCY: 2
      WORKER_POLL_INTERVAL_MS: 150
      WORKER_LEASE_DURATION_SECONDS: 10
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 3
      WORKER_RECOVERY_POLL_INTERVAL_MS: 3000
      ADMIN_API_KEY: qf_admin_dev_secret_2026
      JAVA_OPTS: "-XX:+UseContainerSupport -Xmx256m -Xms128m"
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      multi-db:
        condition: service_healthy
      multi-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M

networks:
  default:
    name: queueforge-multi-net
