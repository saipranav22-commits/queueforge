spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5435}/${DB_NAME:queueforge}
    username: ${DB_USERNAME:queueforge_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QueueForgeTestHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,queueForgeWorker
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: queueforge-backend-test
    distribution:
      percentiles-histogram:
        queueforge.job.execution.duration: true
        queueforge.job.queue_wait_duration: true

queueforge:
  worker:
    enabled: false # Disabled by default in tests; enabled explicitly where coordinator is tested
    concurrency: 4
    poll-interval-ms: 100
    lease-duration-seconds: 30
    heartbeat-interval-seconds: 10
    recovery-poll-interval-ms: 1000
    shutdown-timeout-seconds: 5
    chaos-payloads-enabled: true
  retry:
    initial-delay-seconds: 5
    multiplier: 3.0
    max-delay-seconds: 3600
    jitter-factor: 0.20
  admin:
    api-key: ${ADMIN_API_KEY:qf_admin_dev_secret_2026}
