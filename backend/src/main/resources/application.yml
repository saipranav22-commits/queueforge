server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: queueforge-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5435}/${DB_NAME:queueforge}
    username: ${DB_USERNAME:queueforge_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QueueForgeHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,queueForgeWorker
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        queueforge.job.execution.duration: true
        queueforge.job.queue_wait_duration: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [jobId=%X{jobId:-NONE} worker=%X{workerId:-NONE} attempt=%X{attempt:-0}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [jobId=%X{jobId:-NONE} worker=%X{workerId:-NONE} attempt=%X{attempt:-0}] - %msg%n"
  file:
    name: ${LOG_FILE:logs/queueforge.log}
  level:
    com.queueforge: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

queueforge:
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:4}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:250}
    lease-duration-seconds: ${WORKER_LEASE_DURATION_SECONDS:30}
    heartbeat-interval-seconds: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:10}
    recovery-poll-interval-ms: ${WORKER_RECOVERY_POLL_INTERVAL_MS:5000}
    shutdown-timeout-seconds: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:10}
  retry:
    initial-delay-seconds: ${RETRY_INITIAL_DELAY_SECONDS:5}
    multiplier: ${RETRY_MULTIPLIER:3.0}
    max-delay-seconds: ${RETRY_MAX_DELAY_SECONDS:3600}
    jitter-factor: ${RETRY_JITTER_FACTOR:0.20}
  admin:
    api-key: ${ADMIN_API_KEY:qf_admin_dev_secret_2026}
